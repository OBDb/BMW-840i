generations:
  - name: "First Generation (E31)"
    start_year: 1990
    end_year: 1999
    description: "The first generation BMW 8 Series (E31) was introduced in 1990 and produced until 1999. It debuted at the 1989 Frankfurt Motor Show as a two-door coupe only. The E31 was powered by naturally aspirated V8 and V12 engines, establishing itself as a grand tourer with significant performance credentials. It was the first road car to offer a V12 engine mated to a 6-speed manual transmission and one of the first vehicles to feature electronic drive-by-wire throttle. The E31 was also among BMW's first cars to use a multi-link rear suspension. Despite its innovations and performance, the E31 was discontinued in 1999 due to poor sales."
  - name: "Second Generation (G14/G15/G16)"
    start_year: 2018
    end_year: null
    description: "The second-generation BMW 8 Series was reintroduced in 2018 after a 19-year hiatus, announced on June 15, 2018, with sales commencing in November 2018. This generation introduced three body styles: coupe (G15), convertible (G14), and four-door Gran Coupe (G16), succeeding the BMW 6 Series (F06/F12/F13) lineup. Production commenced in late 2018 at BMW assembly plants in Bangkok, Thailand and Dingolfing, Germany. The new generation features inline-six petrol engines and diesel options, with the high-performance M8 variant and luxury Alpina B8 also available. In 2022, the 8 Series received a mid-cycle update with an illuminated kidney grille and updated infotainment system. The 840i variant features a 3.0L turbocharged inline-six engine delivering strong performance with rear-wheel drive or all-wheel drive (xDrive) options."
